<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Astra's Porfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="assets/videos/background-animation.mp4" type="video/mp4">
        </video>
        
        <!-- Option 2: CSS Animated Background (currently active) -->
        <!-- <div class="animated-bg">
            <div class="floating-shape shape-1"></div>
            <div class="floating-shape shape-2"></div>
            <div class="floating-shape shape-3"></div>
            <div class="floating-shape shape-4"></div>
            <div class="floating-shape shape-5"></div>
        </div> -->
    </div>

    <!-- Aerospace Sky Layer -->
    <div class="sky-layer" aria-hidden="true">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>

        <div class="flight flight-1">
            <span class="contrail"></span>
            <svg class="jet" viewBox="0 0 64 32" xmlns="http://www.w3.org/2000/svg">
                <!-- fuselage -->
                <path d="M4 16 C4 13.5 8 12.5 14 12.5 L52 12.5 C58 12.5 62 14.5 62 16 C62 17.5 58 19.5 52 19.5 L14 19.5 C8 19.5 4 18.5 4 16 Z" fill="#FFFFFF" stroke="#4A6A8A" stroke-width="1.2"/>
                <!-- tail fin -->
                <path d="M6 13 L2 3 L8 3 L16 12.5 Z" fill="#4A90A4" stroke="#4A6A8A" stroke-width="1"/>
                <!-- wing -->
                <path d="M26 17 L18 30 L24 30 L40 17 Z" fill="#DCE8F2" stroke="#4A6A8A" stroke-width="1"/>
                <path d="M28 15 L22 7 L27 7 L38 15 Z" fill="#C9D9E8" stroke="#4A6A8A" stroke-width="1"/>
                <!-- windows -->
                <g fill="#4A6A8A">
                    <circle cx="22" cy="15" r="0.9"/><circle cx="26" cy="15" r="0.9"/><circle cx="30" cy="15" r="0.9"/>
                    <circle cx="34" cy="15" r="0.9"/><circle cx="38" cy="15" r="0.9"/><circle cx="42" cy="15" r="0.9"/>
                    <circle cx="46" cy="15" r="0.9"/>
                </g>
                <path d="M54 14 L58.5 14.6 L57 16 L53.5 16 Z" fill="#4A6A8A"/>
                <!-- nav lights -->
                <circle class="nav-light" cx="3" cy="4" r="1.4" fill="#FF5A5A"/>
                <circle class="nav-light" cx="20" cy="29.5" r="1.4" fill="#4CE08A"/>
            </svg>
        </div>

        <div class="flight flight-2">
            <span class="contrail"></span>
            <svg class="jet" viewBox="0 0 64 32" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 16 C4 13.5 8 12.5 14 12.5 L52 12.5 C58 12.5 62 14.5 62 16 C62 17.5 58 19.5 52 19.5 L14 19.5 C8 19.5 4 18.5 4 16 Z" fill="#FFFFFF" stroke="#4A6A8A" stroke-width="1.2"/>
                <path d="M6 13 L2 3 L8 3 L16 12.5 Z" fill="#E8A87C" stroke="#4A6A8A" stroke-width="1"/>
                <path d="M26 17 L18 30 L24 30 L40 17 Z" fill="#DCE8F2" stroke="#4A6A8A" stroke-width="1"/>
                <path d="M28 15 L22 7 L27 7 L38 15 Z" fill="#C9D9E8" stroke="#4A6A8A" stroke-width="1"/>
                <path d="M54 14 L58.5 14.6 L57 16 L53.5 16 Z" fill="#4A6A8A"/>
                <circle class="nav-light" cx="3" cy="4" r="1.4" fill="#FF5A5A"/>
            </svg>
        </div>
    </div>

    <!-- Theme Toggle -->
    <div class="theme-toggle">
        <button id="theme-btn" class="theme-btn"><img src="assets/images/Sun.png" alt="theme" style="width: 45px; height: 45px; object-fit: contain;"></button>
    </div>

    <!-- Satellite Icon (orbits where the star used to be) -->
    <div class="star-icon" aria-hidden="true">
        <div class="orbit">
            <svg class="satellite" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="24" width="18" height="16" rx="2" fill="#4A90A4" stroke="#2F5D6E" stroke-width="1.5"/>
                <path d="M8 24 V40 M14 24 V40 M2 32 H20" stroke="#9FD8E8" stroke-width="1"/>
                <rect x="44" y="24" width="18" height="16" rx="2" fill="#4A90A4" stroke="#2F5D6E" stroke-width="1.5"/>
                <path d="M50 24 V40 M56 24 V40 M44 32 H62" stroke="#9FD8E8" stroke-width="1"/>
                <path d="M20 32 H24 M40 32 H44" stroke="#8A8A8A" stroke-width="2"/>
                <rect x="24" y="22" width="16" height="20" rx="3" fill="#F2C14E" stroke="#B8862B" stroke-width="1.5"/>
                <path d="M32 22 V14" stroke="#8A8A8A" stroke-width="1.5"/>
                <path d="M26 14 Q32 8 38 14" fill="none" stroke="#8A8A8A" stroke-width="1.5"/>
                <circle class="nav-light" cx="32" cy="8.5" r="2" fill="#FF5A5A"/>
            </svg>
        </div>
    </div>

    <!-- Music Icon -->
    <div class="music-icon">
        <button id="volume-btn-corner" class="volume-btn"><img src="assets/images/Music.png" alt="music" style="width: 45px; height: 45px; object-fit: contain;"></button>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Home Tab -->
        <div class="tab-header">
            <span class="tab-title">Home</span>
            <span class="flight-status"><span class="status-dot"></span>ALT <span id="altitude">35,000</span> ft · CRUISING</span>
        </div>

        <!-- Content Card -->
        <div class="content-card">
            <!-- Main Heading -->
            <h1 class="main-heading">
                <span id="greeting">Hello</span>! <span class="name-highlight">I'm Astra</span>
            </h1>
            
            <!-- Subtitle -->
            <p class="subtitle"><span id="subtitle-text">Software Engineer · Aerospace</span></p>

            <!-- Navigation Icons -->
            <div class="nav-icons">
                <div class="nav-item" data-section="About">
                    <div class="icon"><img src="assets/images/About.png" alt="about" class="icon-img"></div>
                    <span class="nav-label">Crew</span><span class="nav-sublabel">about</span>
                </div>
                <div class="nav-item" data-section="Experience">
                    <div class="icon"><img src="assets/images/Cat.png" alt="experience" class="icon-img"></div>
                    <span class="nav-label">Flight Log</span><span class="nav-sublabel">experience</span>
                </div>
                <div class="nav-item" data-section="Projects">
                    <div class="icon"><img src="assets/images/Project.png" alt="projects" class="icon-img"></div>
                    <span class="nav-label">Hangar</span><span class="nav-sublabel">projects</span>
                </div>
                <div class="nav-item" data-section="Education">
                    <div class="icon"><img src="assets/images/Edcuation-removebg-preview.png" alt="Education" class="icon-img"></div>
                    <span class="nav-label">School</span><span class="nav-sublabel">education</span>
                </div>
                <div class="nav-item" data-section="Contact">
                    <div class="icon"><img src="assets/images/Mail.png" alt="mail" class="icon-img"></div>
                    <span class="nav-label">Tower</span><span class="nav-sublabel">contact</span>
                </div>
            </div>
        </div>

        <!-- Social Links -->
        <div class="social-links">
            <a href="https://www.linkedin.com/in/astra-n-40b024259/" target="_blank" class="social-icon"><img src="assets/images/linkedin-removebg-preview.png" alt="LinkedIn" style="width: 30px; height: 30px; object-fit: contain;"></a>
            <a href="https://github.com/wkeav" target="_blank" class="social-icon"><img src="assets/images/github-removebg-preview.png" alt="Github" style="width: 30px; height: 30px; object-fit: contain;"></a>
        </div>

        <!-- Copyright -->
        <div class="copyright">
            Made with ♥ by Astra
        </div>
    </div>

    <!-- Decorative Fish -->
    <div class="frog-character"><img src="assets/images/Fish.png" alt="fish" class="fish-img"></div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-container">
            <!-- Modal Header -->
            <div class="modal-header">
                <span id="modal-tab-title" class="modal-tab-title">about</span>
                <button id="close-modal" class="close-btn">[×]</button>
            </div>
            
            <!-- Modal Content -->
            <div id="modal-content" class="modal-content">
                <!-- Content will be dynamically loaded here -->
            </div>
        </div>
        
        <!-- Navigation tabs at bottom -->
        <div class="modal-nav-tabs">
            <div class="nav-tab" data-section="About">Crew<span class="nav-tab-sub">about</span></div>
            <div class="nav-tab" data-section="Experience">Flight Log<span class="nav-tab-sub">experience</span></div>
            <div class="nav-tab" data-section="Projects">Hangar<span class="nav-tab-sub">projects</span></div>
            <div class="nav-tab" data-section="Education">School<span class="nav-tab-sub">education</span></div>
            <div class="nav-tab" data-section="Contact">Tower<span class="nav-tab-sub">contact</span></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
